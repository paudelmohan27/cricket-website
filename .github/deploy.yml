name: Deploy CricVerse to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # allows manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject RapidAPI key into script.js
        # Replaces the placeholder with the real secret.
        # The secret value NEVER appears in logs or source code.
        run: |
          sed -i "s|YOUR_NEW_RAPIDAPI_KEY|${{ secrets.RAPIDAPI_KEY }}|g" script.js

      - name: Verify injection
        run: |
          if grep -q "YOUR_NEW_RAPIDAPI_KEY" script.js; then
            echo "❌ Placeholder still found — did you set the RAPIDAPI_KEY secret?"
            exit 1
          else
            echo "✅ API key injected successfully"
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
